<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/images/favicon.png" />

  <!-- Responsive -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <!-- Title -->
  <title>
    Glow Beauty | Premium Cosmetics, Skincare & Beauty Products
  </title>

  <!-- SEO Description -->
  <meta
    name="description"
    content="Glow Beauty offers premium skincare, makeup, haircare, fragrances, and luxury beauty products. Discover high-quality cosmetics designed to enhance your natural beauty."
  />

  <!-- SEO Keywords -->
  <meta
    name="keywords"
    content="Glow Beauty, Cosmetics, Skincare, Makeup, Haircare, Fragrance, Beauty Store, Luxury Beauty, Premium Cosmetics"
  />

  <!-- Author -->
  <meta
    name="author"
    content="Glow Beauty"
  />

  <!-- Robots -->
  <meta
    name="robots"
    content="index, follow"
  />

  <!-- Theme Color -->
  <meta
    name="theme-color"
    content="#db2777"
  />

  <!-- Open Graph -->
  <meta
    property="og:type"
    content="website"
  />

  <meta
    property="og:title"
    content="Glow Beauty | Premium Cosmetics & Skincare"
  />

  <meta
    property="og:description"
    content="Discover premium skincare, makeup, fragrances, and beauty essentials with Glow Beauty."
  />

  <meta
    property="og:image"
    content="/images/og-image.jpg"
  />

  <meta
    property="og:url"
    content="https://your-domain.com"
  />

  <meta
    property="og:site_name"
    content="Glow Beauty"
  />

  <!-- Twitter -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="Glow Beauty | Premium Cosmetics & Skincare"
  />

  <meta
    name="twitter:description"
    content="Luxury skincare, makeup, fragrances and beauty products."
  />

  <meta
    name="twitter:image"
    content="/images/og-image.jpg"
  />

  <!-- Canonical -->
  <link
    rel="canonical"
    href="https://your-domain.com"
  />
</head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

  </body>
</html>
